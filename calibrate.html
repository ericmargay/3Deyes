<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3Deyes · calibración 3D</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    body { font-family: ui-monospace, Menlo, Consolas, monospace; color: #ddd; font-size: 12px; }
    canvas { display: block; }
    #labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    .lbl { color: #fff; font-size: 12px; background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 3px; white-space: nowrap; }
    .lbl.small { font-size: 10px; color: #bbb; }
    .lbl.ok { color: #3ddc84; } .lbl.bad { color: #ff4f6d; }
    #report {
      position: fixed; left: 12px; top: 12px; z-index: 10; max-width: 520px;
      background: rgba(6, 5, 14, .8); border: 1px solid #ff4fa3; border-radius: 8px; padding: 10px 14px; line-height: 1.5;
    }
    #report h1 { font-size: 13px; margin: 0 0 6px; color: #ff4fa3; }
    #report .grid { display: grid; grid-template-columns: auto auto; gap: 1px 14px; }
    #report .grid b { color: #fff; font-weight: 600; text-align: right; white-space: nowrap; }
    .rec { margin-top: 8px; padding: 6px 10px; border-radius: 6px; background: #1c3a2a; border: 1px solid #3ddc84; font-size: 13px; }
    .rec.bad { background: #3a1c22; border-color: #ff4f6d; }
    .rec.warn { background: #3a331c; border-color: #ffd166; }
    #help { position: fixed; left: 12px; bottom: 12px; z-index: 10; font-size: 11px; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; white-space: pre; }
    #editor {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(900px, 90vw); height: min(620px, 85vh); z-index: 20;
      background: rgba(8, 8, 14, .96); border: 1px solid #4fd1c5; border-radius: 8px; padding: 10px; display: none; flex-direction: column; gap: 8px;
    }
    #editor.open { display: flex; }
    #editor textarea { flex: 1; background: #0b0b12; color: #dfe8ff; border: 1px solid #333; border-radius: 4px; padding: 8px; font: 12px/1.45 ui-monospace, Menlo, monospace; resize: none; tab-size: 4; }
    #editor .bar { display: flex; gap: 8px; align-items: center; }
    #editor .err { color: #ff4f6d; white-space: pre-wrap; font-size: 11px; max-height: 90px; overflow: auto; }
    button, select { background: #1b1530; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 4px 9px; font: inherit; cursor: pointer; }
    button.primary { background: #4fd1c5; color: #000; border-color: #4fd1c5; font-weight: 600; }
    .hidden { display: none !important; }
    .lil-gui { --width: 320px; --font-size: 11px; }
  </style>
</head>
<body>
  <div id="labels"></div>
  <div id="report"></div>
  <div id="help">[1-4] cámara: general · público · lateral · cenital   [E] editor shader   [G] GUI   [H] ocultar todo   [F] fullscreen   arrastrar/rueda: orbitar</div>
  <div id="editor">
    <div class="bar">
      <b>Shader del mural</b> <span style="color:#888">(mainImage estilo Shadertoy · rgb = color, alpha = relieve)</span>
      <span style="flex:1"></span>
      <select id="presetSel"></select>
      <button id="compile" class="primary">compilar</button>
      <button id="closeEditor">cerrar (E)</button>
    </div>
    <textarea id="src" spellcheck="false"></textarea>
    <div class="err" id="err"></div>
  </div>
  <script type="module" src="/src/calibrate.js"></script>
</body>
</html>
