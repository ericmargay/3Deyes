<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3Deyes</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    body { font-family: ui-monospace, Menlo, Consolas, monospace; color: #ddd; }
    canvas { display: block; }
    #hud {
      position: fixed; left: 12px; bottom: 12px; z-index: 10;
      font-size: 12px; line-height: 1.5; pointer-events: none;
      background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 6px;
      white-space: pre; opacity: 1; transition: opacity .3s;
    }
    #hud.hidden { opacity: 0; }
    #help {
      position: fixed; right: 12px; bottom: 12px; z-index: 10; font-size: 11px; line-height: 1.45;
      background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 6px; white-space: pre; opacity: .8;
    }
    #help.hidden { display: none; }
    .lil-gui { --width: 300px; --font-size: 11px; }
    .cp-handle {
      position: fixed; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
      border: 2px solid #ff4fa3; background: rgba(255,79,163,.25); cursor: grab; z-index: 20; display: none;
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="help">[1-4] escena   [M] modo stereo   [S] swap ojos   [G] GUI   [H] ayuda   [P] corner-pin   [C] calibrar   [F] fullscreen   [R] reset</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
